name: release-server

on:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#server-v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/src/Mail.Server.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mail-server:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mail-server:latest
