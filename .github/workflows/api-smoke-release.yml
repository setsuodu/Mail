name: API Smoke (Release Tag)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  smoke:
    name: Compose + Smoke (tag)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare .env
        working-directory: server
        run: cp -n .env.example .env 2>/dev/null || cp .env.example .env
      - name: Up
        working-directory: server
        run: |
          docker compose up --build -d
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:12081/health && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - name: Smoke
        working-directory: server
        env:
          BASE: http://127.0.0.1:12081
          ADMIN_KEY: dev-admin-key
          JWT_SECRET: dev-jwt-secret-shared-with-mp
        run: python scripts/smoke_test.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-smoke-release-${{ github.ref_name }}-${{ github.sha }}
          path: server/test-results/
          retention-days: 90
      - if: always()
        working-directory: server
        run: docker compose down -v || true
