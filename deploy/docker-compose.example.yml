# Integrator example — host ports follow company plan (120xx component zone).
# Mail server suggested host port: 12081 (BugReport uses 12080).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
      POSTGRES_DB: mail
    volumes:
      - mail_pgdata:/var/lib/postgresql/data
    ports:
      - "12033:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail"]
      interval: 5s
      timeout: 5s
      retries: 5

  mail-server:
    image: ghcr.io/<org>/mail-server:1.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=mail;Username=mail;Password=mail
      - Auth__AdminApiKey=change-me-admin
      - Auth__JwtSecret=change-me-shared-with-mp
      - DefaultProjectId=default
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "12081:8080"

volumes:
  mail_pgdata:
